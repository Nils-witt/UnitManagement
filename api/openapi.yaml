openapi: 3.1.0
info:
  title: go-unit-mangement API
  description: |
    JSON API of go-unit-mangement, served under `/api` next to the embedded web UI.

    Authentication uses a JWT access token sent as `Authorization: Bearer <token>`.
    It is returned by `POST /api/auth/login` or handed to the web UI at the end
    of the SSO flow, and is valid until it expires or its session is ended
    (sign-out, password reset, account deletion).

    When `OIDC_ACCESS_TOKEN_AUDIENCE` is set, a JWT access token issued by the
    SSO provider (or by an issuer in `OIDC_ACCESS_TOKEN_ISSUERS`) is accepted
    as the bearer token too, without signing in first. It must be signed with
    the issuer's published keys, unexpired, and carry one of the configured
    audiences in `aud`; ID tokens and opaque tokens are rejected. Its `sub`
    resolves to the linked account, which is created on first use.

    An RS256 JWT whose `kid` header names a registered API key
    (`POST /api/users/{id}/api-keys`) is accepted too and acts as that key's
    user. It must be signed with the key's private half, carry `iat` and
    `exp` no more than an hour apart, and be unexpired. Other instances
    syncing units from this one authenticate this way (see the `sync` tag).

    Errors are returned as `{"error": "<message>"}`.
    Request bodies are limited to 1 MiB.
  version: 1.0.0
servers:
  - url: /
tags:
  - name: auth
    description: Sign-in, sign-out and the current session.
  - name: users
    description: User management (administrators only).
  - name: groups
    description: Groups synced from the SSO provider (administrators only).
  - name: units
    description: Units and their last known position.
  - name: audit
    description: The audit log of sign-ins and changes (administrators only).
  - name: settings
    description: Instance-wide settings, changed by administrators in the web UI.
  - name: sync
    description: >-
      Mirroring the units of other instances (administrators only). This
      instance signs its requests to them with its own key pair; each remote
      registers the public key as an API key under this instance's server UUID.
  - name: system
    description: Build info and health.

security:
  - bearerAuth: []

paths:
  /api/auth/methods:
    get:
      tags: [auth]
      summary: List available sign-in methods
      description: Tells the login page whether SSO is configured.
      operationId: getAuthMethods
      security: []
      responses:
        "200":
          description: Available sign-in methods.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMethods"

  /api/auth/login:
    post:
      tags: [auth]
      summary: Sign in with username and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in; the response carries the access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid username or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: invalid username or password
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Sign out
      description: |
        Ends the session of the Bearer token sent, if any; the client should
        discard the token. Always succeeds.
      operationId: logout
      security:
        - {}
        - bearerAuth: []
      responses:
        "204":
          description: Signed out.

  /api/auth/me:
    get:
      tags: [auth]
      summary: Get the signed-in user
      operationId: getCurrentUser
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/oidc/login:
    get:
      tags: [auth]
      summary: Start SSO sign-in
      description: |
        Browser navigation, not an XHR call. Redirects to the OpenID Connect
        provider. Only available when SSO is configured (404 otherwise).
        On failure it redirects to `/login?sso_error=failed`.
      operationId: startOidcLogin
      security: []
      parameters:
        - name: redirect
          in: query
          description: Same-origin path to return to after sign-in. Anything else falls back to `/`.
          schema:
            type: string
            example: /units
      responses:
        "302":
          description: Redirect to the identity provider.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: Short-lived `oidc_flow` cookie holding the sign-in state.
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /api/auth/oidc/callback:
    get:
      tags: [auth]
      summary: SSO callback
      description: |
        Redirect target registered at the identity provider. On success it
        redirects to the path passed to `/api/auth/oidc/login` with the access
        token in the URL fragment (`#sso_token=<token>`), where only the page
        itself can read it. On failure it redirects to
        `/login?sso_error=<code>` with `code` one of `denied`, `expired` or
        `failed`. Only available when SSO is configured (404 otherwise).
      operationId: oidcCallback
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
        - name: error_description
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the app (signed in) or back to the login page.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: Clears the `oidc_flow` cookie.
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /api/users:
    get:
      tags: [users]
      summary: List users
      description: Sorted by username.
      operationId: listUsers
      responses:
        "200":
          description: All users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [users]
      summary: Create a user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: The created user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The username is already taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: username is already taken
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [users]
      summary: Update a user
      description: |
        Sets the administrator role and optionally a new password. Changing the
        password ends all of the user's sessions. Administrators cannot remove
        their own administrator role.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [users]
      summary: Delete a user
      description: Administrators cannot delete their own account.
      operationId: deleteUser
      responses:
        "204":
          description: The user was deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/{id}/tokens:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      summary: List a user's API tokens
      description: >-
        The user's unexpired API tokens, newest first. Sign-in sessions are
        not included, and token values are never returned again.
      operationId: listUserTokens
      responses:
        "200":
          description: The user's API tokens.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [users]
      summary: Create an API token for a user
      description: |
        Issues a named access token that authenticates as the user until it
        expires, e.g. for a device or integration. The lifetime is chosen
        freely between one minute and ten years. The token ends early when it
        is revoked, the user is deleted or their password is changed. Its
        value is only returned in this response.
      operationId: createUserToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: The token was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedApiToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/{id}/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - name: tokenId
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    delete:
      tags: [users]
      summary: Revoke an API token
      description: The token stops working immediately.
      operationId: revokeUserToken
      responses:
        "204":
          description: The token was revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such API token for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: token not found
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/{id}/api-keys:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      summary: List a user's API keys
      description: Newest first.
      operationId: listUserApiKeys
      responses:
        "200":
          description: The user's API keys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [users]
      summary: Register an API key for a user
      description: |
        Registers a public key under a caller-chosen ID. Whoever holds the
        private key can then act as the user by signing short-lived RS256
        JWTs with `kid` set to the ID (see the API description). To let
        another instance sync units from this one, use its server UUID and
        public key from its `GET /api/sync/identity`.
      operationId: createUserApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: The key was registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/UserNotFound"
        "409":
          description: An API key with this ID already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/{id}/api-keys/{keyId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - name: keyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [users]
      summary: Delete an API key
      description: JWTs signed with it stop working immediately.
      operationId: deleteUserApiKey
      responses:
        "204":
          description: The key was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such API key for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/groups:
    get:
      tags: [groups]
      summary: List groups
      description: >-
        Sorted by name, members by username. Groups are created when a member
        first signs in via SSO and kept after their last member leaves.
      operationId: listGroups
      responses:
        "200":
          description: All groups.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/settings:
    get:
      tags: [settings]
      summary: Get settings
      operationId: getSettings
      responses:
        "200":
          description: The current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [settings]
      summary: Update settings
      description: >-
        Administrators only. Replaces all settings; an empty value restores the
        default. A change is recorded in the audit log as `settings.update`.
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: The settings as stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/sync/identity:
    get:
      tags: [sync]
      summary: Get this instance's sync identity
      description: >-
        The server UUID and public key another instance registers as an API
        key to let this one sync from it. Both are generated on first start
        and stored in `KEYS_DIR`.
      operationId: getSyncIdentity
      responses:
        "200":
          description: This instance's identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncIdentity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/sync/remotes:
    get:
      tags: [sync]
      summary: List sync remotes
      description: Sorted by name.
      operationId: listSyncRemotes
      responses:
        "200":
          description: All sync remotes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncRemote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [sync]
      summary: Add a sync remote
      description: An enabled remote starts syncing right away.
      operationId: createSyncRemote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRemoteRequest"
      responses:
        "201":
          description: The remote was added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRemote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/sync/remotes/{id}:
    parameters:
      - $ref: "#/components/parameters/SyncRemoteId"
    get:
      tags: [sync]
      summary: Get a sync remote
      operationId: getSyncRemote
      responses:
        "200":
          description: The remote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRemote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SyncRemoteNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [sync]
      summary: Update a sync remote
      description: >-
        Its worker restarts when the URL or interval changes, and stops or
        starts with `enabled`.
      operationId: updateSyncRemote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRemoteRequest"
      responses:
        "200":
          description: The updated remote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncRemote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SyncRemoteNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [sync]
      summary: Delete a sync remote
      description: Stops syncing; the units mirrored from it stay as ordinary local units.
      operationId: deleteSyncRemote
      responses:
        "204":
          description: The remote was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SyncRemoteNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/sync/remotes/{id}/trigger:
    parameters:
      - $ref: "#/components/parameters/SyncRemoteId"
    post:
      tags: [sync]
      summary: Start a full sync now
      operationId: triggerSyncRemote
      responses:
        "202":
          description: A full sync was queued.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SyncRemoteNotFound"
        "409":
          description: The remote is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/sync/remotes/{id}/logs:
    parameters:
      - $ref: "#/components/parameters/SyncRemoteId"
    get:
      tags: [sync]
      summary: Get a sync remote's recent activity
      description: Oldest first, at most 200 entries; kept in memory only, so empty after a restart.
      operationId: listSyncRemoteLogs
      responses:
        "200":
          description: Recent log entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncLogEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/SyncRemoteNotFound"

  /api/audit-log:
    get:
      tags: [audit]
      summary: List audit log entries
      description: >-
        Newest first. Records sign-ins (also failed ones), sign-outs and every
        change to users, API tokens and units. A unit's position is never
        recorded, including removing it, since the position history covers
        it; an update that changes only the position leaves no entry. Page through
        older entries by passing the last entry's `id` as `before`.
      operationId: listAuditLog
      parameters:
        - name: limit
          in: query
          description: Maximum number of entries to return.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: before
          in: query
          description: Only entries older than the entry with this ID.
          schema:
            type: integer
            minimum: 1
        - name: action
          in: query
          description: Only entries of this action.
          schema:
            $ref: "#/components/schemas/AuditAction"
        - name: actor
          in: query
          description: Only entries of the user with this ID.
          schema:
            type: integer
            minimum: 1
        - name: targetType
          in: query
          schema:
            $ref: "#/components/schemas/AuditTargetType"
        - name: targetId
          in: query
          description: Only entries about the record with this ID, e.g. a unit's UUID.
          schema:
            type: string
        - name: since
          in: query
          description: Only entries recorded at or after this time (RFC 3339).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only entries recorded at or before this time (RFC 3339). Must not be before `since`.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The matching entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/units:
    get:
      tags: [units]
      summary: List units
      description: Sorted by name.
      operationId: listUnits
      responses:
        "200":
          description: All units.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Unit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [units]
      summary: Create a unit
      operationId: createUnit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitRequest"
      responses:
        "201":
          description: The created unit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/UnitNameTaken"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/units/events:
    get:
      tags: [units]
      summary: Stream unit changes
      description: |
        WebSocket endpoint (`ws://` / `wss://`). After the upgrade the server
        sends one JSON text message, a `UnitEvent`, for every unit that is
        created, updated or deleted; it ignores anything the client sends.

        Browsers can't set headers on a WebSocket, so besides the
        Authorization header the token is accepted as the subprotocols
        `bearer, <token>`; the server then selects `bearer`. Upgrades from
        any origin are accepted. The stream closes when the
        session ends (code 1008), when the server shuts down (1001), or when
        the client falls too far behind (1013). Changes made while
        disconnected are not replayed, so clients should refetch
        `GET /api/units` after reconnecting.
      operationId: streamUnitEvents
      responses:
        "101":
          description: Switched to the WebSocket protocol; messages are `UnitEvent`s.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/units/{id}:
    parameters:
      - $ref: "#/components/parameters/UnitId"
    get:
      tags: [units]
      summary: Get a unit
      operationId: getUnit
      responses:
        "200":
          description: The unit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnitNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [units]
      summary: Update a unit
      description: >
        Replaces the unit's name, symbol and tactical name; a missing or null
        symbol or tactical name clears it. The position is left alone; it is
        set via `PUT /api/units/{id}/position`, and a body with `position` is
        rejected.
      operationId: updateUnit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitRequest"
      responses:
        "200":
          description: The updated unit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnitNotFound"
        "409":
          $ref: "#/components/responses/UnitNameTaken"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [units]
      summary: Partially update a unit
      description: >
        Changes only the fields present in the body. A null symbol or tactical
        name clears it; symbol and tactical name are replaced as a whole, not
        merged. The position is set via `PUT /api/units/{id}/position`, and a
        body with `position` is rejected.
      operationId: patchUnit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitPatchRequest"
      responses:
        "200":
          description: The updated unit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnitNotFound"
        "409":
          $ref: "#/components/responses/UnitNameTaken"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [units]
      summary: Delete a unit
      operationId: deleteUnit
      responses:
        "204":
          description: The unit was deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnitNotFound"
        "409":
          $ref: "#/components/responses/UnitSynced"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/units/{id}/position:
    parameters:
      - $ref: "#/components/parameters/UnitId"
    put:
      tags: [units]
      summary: Set a unit's position
      description: >
        Sets the unit's current position and adds it to the position history.
        Setting the position it already has changes nothing. Position changes
        are not audited; the history records who set each one.
      operationId: setUnitPosition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Position"
      responses:
        "200":
          description: The unit with its new position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnitNotFound"
        "409":
          $ref: "#/components/responses/UnitSynced"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [units]
      summary: Clear a unit's position
      description: Clears the unit's current position; its position history is kept.
      operationId: clearUnitPosition
      responses:
        "200":
          description: The unit without a position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnitNotFound"
        "409":
          $ref: "#/components/responses/UnitSynced"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/units/{id}/positions:
    parameters:
      - $ref: "#/components/parameters/UnitId"
    get:
      tags: [units]
      summary: Get a unit's position history
      description: >
        Lists the positions the unit has had, newest measurement first. An
        entry is added whenever the unit's position is set or changes; clearing
        the position keeps the history.
      operationId: getUnitPositions
      parameters:
        - name: limit
          in: query
          description: Maximum number of entries to return.
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
        - name: since
          in: query
          description: >
            Only positions measured at or after this time (RFC 3339). The limit
            still applies, keeping the newest entries.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: >
            Only positions measured at or before this time (RFC 3339), for a
            timeframe that ends in the past. Must not be before `since`.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The position history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PositionHistoryEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/UnitNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/version:
    get:
      tags: [system]
      summary: Get build info
      operationId: getVersion
      security: []
      responses:
        "200":
          description: Build metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"

  /api/instance:
    get:
      tags: [system]
      summary: Get instance info
      description: Public, so the login page can show the instance name.
      operationId: getInstance
      security: []
      responses:
        "200":
          description: Instance metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"

  /api/health:
    get:
      tags: [system]
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        An access token from `POST /api/auth/login`, the SSO flow or
        `POST /api/users/{id}/tokens`, or, when enabled, a JWT access token
        from a trusted OIDC provider.

  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: User ID. A malformed ID is answered with 404.
      schema:
        type: integer
        minimum: 1
    UnitId:
      name: id
      in: path
      required: true
      description: Unit UUID. A malformed ID is answered with 404.
      schema:
        type: string
        format: uuid
    SyncRemoteId:
      name: id
      in: path
      required: true
      description: Sync remote UUID. A malformed ID is answered with 404.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: The request body is malformed or fails validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: invalid request body
    Unauthorized:
      description: No valid access token.
      headers:
        WWW-Authenticate:
          description: '`Bearer`, or `Bearer error="invalid_token"` when a token was sent but is invalid, expired or revoked.'
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: unauthorized
    Forbidden:
      description: The signed-in user is not an administrator.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: forbidden
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: not found
    UserNotFound:
      description: The user does not exist, or the ID is not a positive integer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: user not found
    UnitNotFound:
      description: The unit does not exist, or the ID is not a UUID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: unit not found
    UnitNameTaken:
      description: >-
        Another unit already has this name, or the unit is synced from another
        instance and can only be changed there.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: unit name is already taken
    UnitSynced:
      description: The unit is synced from another instance and can only be changed there.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: unit is synced from another instance and can only be changed there
    SyncRemoteNotFound:
      description: No such sync remote.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: sync remote not found
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: internal error

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    AuthMethods:
      type: object
      required: [oidc]
      properties:
        oidc:
          type: boolean
          description: Whether SSO is configured.
        oidcName:
          type: string
          description: Display name of the SSO provider; present only when `oidc` is true.

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1

    LoginResponse:
      type: object
      required: [token, tokenType, expiresAt, user]
      properties:
        token:
          type: string
          description: "JWT access token, sent as `Authorization: Bearer <token>`."
        tokenType:
          type: string
          const: Bearer
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, username, isAdmin, sso, hasPassword, adminManaged, groups, createdAt, updatedAt]
      properties:
        id:
          type: integer
          minimum: 1
        username:
          type: string
        isAdmin:
          type: boolean
        sso:
          type: boolean
          description: Whether the user is linked to an SSO identity.
        hasPassword:
          type: boolean
          description: Whether the user can sign in with a password.
        adminManaged:
          type: boolean
          description: >-
            Whether isAdmin is synced from the SSO provider's groups
            (OIDC_ADMIN_GROUP); updates must then leave it unchanged.
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GroupRef"
          description: >-
            The user's groups at the SSO provider as of their last sign-in,
            sorted by name. Always empty for local accounts.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Surrounding whitespace is trimmed.
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 8
        isAdmin:
          type: boolean
          default: false

    UpdateUserRequest:
      type: object
      properties:
        isAdmin:
          type: boolean
          description: >-
            The new role. Omitting it removes the administrator role. Must
            equal the current role when the user's adminManaged is true.
        password:
          type: string
          description: New password (at least 8 characters). Empty or missing keeps the current one.

    CreateTokenRequest:
      type: object
      required: [name, ttlSeconds]
      properties:
        name:
          type: string
          description: Identifies the token, e.g. the device using it. Surrounding whitespace is trimmed.
          minLength: 1
          maxLength: 64
        ttlSeconds:
          type: integer
          description: How long the token is valid, in seconds.
          minimum: 60
          maximum: 315360000
          example: 2592000

    ApiToken:
      type: object
      required: [id, name, createdAt, expiresAt]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    CreatedApiToken:
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [token, tokenType]
          properties:
            token:
              type: string
              description: "JWT access token, sent as `Authorization: Bearer <token>`. Only returned here."
            tokenType:
              type: string
              const: Bearer

    GroupRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    Group:
      type: object
      required: [id, name, members, createdAt, updatedAt]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          description: The group's name at the SSO provider.
        members:
          type: array
          items:
            $ref: "#/components/schemas/UserRef"
        createdAt:
          type: string
          format: date-time
          description: When a member first signed in with this group.
        updatedAt:
          type: string
          format: date-time

    AuditAction:
      type: string
      enum:
        - auth.login
        - auth.login_failed
        - auth.logout
        - user.create
        - user.update
        - user.delete
        - token.create
        - token.revoke
        - api_key.create
        - api_key.delete
        - sync_remote.create
        - sync_remote.update
        - sync_remote.delete
        - sync_remote.trigger
        - unit.create
        - unit.update
        - unit.delete
        - settings.update

    AuditTargetType:
      type: string
      enum: [user, token, unit, api_key, sync_remote]

    AuditLogEntry:
      type: object
      required: [id, createdAt, action, actor, actorName, targetType, targetId, targetName, details, remoteAddr]
      properties:
        id:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        action:
          $ref: "#/components/schemas/AuditAction"
        actor:
          description: Who acted; null for anonymous requests and once the user is deleted.
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        actorName:
          type: string
          description: >-
            The actor's username at the time; for a failed sign-in, the
            username that was tried. Empty for other anonymous requests.
        targetType:
          description: Type of the record acted on; empty for sign-ins and sign-outs.
          oneOf:
            - $ref: "#/components/schemas/AuditTargetType"
            - type: string
              const: ""
        targetId:
          type: string
          description: ID of the record acted on, e.g. a unit's UUID.
        targetName:
          type: string
          description: Name of the record acted on at the time.
        details:
          type: object
          additionalProperties: true
          description: >-
            Action-specific values: `method` (password or oidc) for sign-ins,
            `isAdmin` and `passwordChanged` for user updates, `userId`,
            `username` and `expiresAt` for API tokens, `changed` (the changed
            fields among name, symbol and tacticalName) for unit updates.
        remoteAddr:
          type: string
          description: The client's IP address.

    UserRef:
      type: object
      description: A reference to a user, e.g. who created or last changed something.
      required: [id, username]
      properties:
        id:
          type: integer
        username:
          type: string

    Position:
      type: object
      required: [lat, lon]
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lon:
          type: number
          format: double
          minimum: -180
          maximum: 180
        height:
          type: [number, "null"]
          format: double
          description: Height in meters; null when unknown.
        accuracy:
          type: [number, "null"]
          format: double
          minimum: 0
          description: Horizontal accuracy radius in meters; null when unknown.
        speed:
          type: [number, "null"]
          format: double
          minimum: 0
          description: Speed over ground in meters per second; null when unknown.
        course:
          type: [number, "null"]
          format: double
          minimum: 0
          exclusiveMaximum: 360
          description: Course over ground in degrees clockwise from true north; null when unknown.
        timestamp:
          type: [string, "null"]
          format: date-time
          description: When the position was measured. Requests may omit it to mean "now".

    PositionHistoryEntry:
      allOf:
        - $ref: "#/components/schemas/Position"
        - type: object
          required: [timestamp, recordedAt, recordedBy]
          properties:
            recordedAt:
              type: string
              format: date-time
              description: When the entry was recorded.
            recordedBy:
              description: Who set the position; null once that user is deleted.
              oneOf:
                - $ref: "#/components/schemas/UserRef"
                - type: "null"

    UnitRequest:
      type: object
      description: The position is not part of it; see `PUT /api/units/{id}/position`.
      required: [name]
      properties:
        name:
          type: string
          description: Surrounding whitespace is trimmed; must be unique.
          minLength: 1
          maxLength: 64
        symbol:
          description: A missing or null symbol, or one without components, clears it.
          oneOf:
            - $ref: "#/components/schemas/UnitSymbol"
            - type: "null"
        tacticalName:
          description: A missing or null tactical name, or one without parts, clears it.
          oneOf:
            - $ref: "#/components/schemas/TacticalName"
            - type: "null"

    UnitPatchRequest:
      type: object
      description: Missing fields are left unchanged.
      properties:
        name:
          type: string
          description: Surrounding whitespace is trimmed; must be unique.
          minLength: 1
          maxLength: 64
        symbol:
          description: A null symbol, or one without components, clears it.
          oneOf:
            - $ref: "#/components/schemas/UnitSymbol"
            - type: "null"
        tacticalName:
          description: A null tactical name, or one without parts, clears it.
          oneOf:
            - $ref: "#/components/schemas/TacticalName"
            - type: "null"

    TacticalName:
      type: object
      description: >
        The unit's radio call sign, split into its parts, e.g. "Rotkreuz
        Musterstadt 12/83-1". Surrounding whitespace is trimmed and empty parts
        are omitted.
      properties:
        organisation:
          $ref: "#/components/schemas/TacticalNamePart"
        regionalAssociation:
          $ref: "#/components/schemas/TacticalNamePart"
        localAssociation:
          $ref: "#/components/schemas/TacticalNamePart"
        function:
          $ref: "#/components/schemas/TacticalNamePart"
        number:
          $ref: "#/components/schemas/TacticalNamePart"
      example:
        organisation: Rotkreuz
        regionalAssociation: Musterstadt
        localAssociation: "12"
        function: "83"
        number: "1"

    TacticalNamePart:
      type: string
      maxLength: 32
      description: Must not contain control characters.

    UnitSymbol:
      type: object
      description: >
        Tactical symbol (DV 102) as component IDs of the
        [@taktische-zeichen/core](https://taktische-zeichen.dev/) library, which
        renders it in the web UI. The server only checks the ID format, not the
        catalog. Empty components are omitted.
      properties:
        grundzeichen:
          $ref: "#/components/schemas/SymbolComponentId"
        organisation:
          $ref: "#/components/schemas/SymbolComponentId"
        fachaufgabe:
          $ref: "#/components/schemas/SymbolComponentId"
        einheit:
          $ref: "#/components/schemas/SymbolComponentId"
        verwaltungsstufe:
          $ref: "#/components/schemas/SymbolComponentId"
        funktion:
          $ref: "#/components/schemas/SymbolComponentId"
        symbol:
          $ref: "#/components/schemas/SymbolComponentId"
      example:
        grundzeichen: kraftfahrzeug-gelaendegaengig
        organisation: feuerwehr
        fachaufgabe: brandbekaempfung
        einheit: gruppe

    SymbolComponentId:
      type: string
      pattern: "^[a-z0-9-]{1,64}$"

    Unit:
      type: object
      required:
        [
          id,
          name,
          position,
          symbol,
          tacticalName,
          createdAt,
          updatedAt,
          createdBy,
          updatedBy,
          syncedFrom,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        position:
          description: >
            The current position; null when unknown. Read-only here, set via
            `PUT /api/units/{id}/position`.
          oneOf:
            - $ref: "#/components/schemas/Position"
            - type: "null"
        symbol:
          oneOf:
            - $ref: "#/components/schemas/UnitSymbol"
            - type: "null"
        tacticalName:
          oneOf:
            - $ref: "#/components/schemas/TacticalName"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          description: Null once that user has been deleted.
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        updatedBy:
          description: Null once that user has been deleted, and for units synced from another instance.
          oneOf:
            - $ref: "#/components/schemas/UserRef"
            - type: "null"
        syncedFrom:
          description: >-
            The sync remote the unit is mirrored from, where alone it can be
            changed; null for local units.
          oneOf:
            - $ref: "#/components/schemas/SyncRemoteRef"
            - type: "null"

    SyncRemoteRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    ApiKey:
      type: object
      required: [id, name, publicKeyPem, createdAt, lastUsedAt]
      properties:
        id:
          type: string
          format: uuid
          description: The `kid` JWTs signed with this key carry.
        name:
          type: string
        publicKeyPem:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          description: Null until first used; updated at most once a minute.
          oneOf:
            - type: string
              format: date-time
            - type: "null"

    CreateApiKeyRequest:
      type: object
      required: [id, name, publicKeyPem]
      properties:
        id:
          type: string
          format: uuid
          description: For another instance, its server UUID.
        name:
          type: string
          minLength: 1
          maxLength: 64
        publicKeyPem:
          type: string
          description: PEM-encoded PKIX RSA public key of at least 2048 bits.

    SyncIdentity:
      type: object
      required: [serverUuid, publicKeyPem]
      properties:
        serverUuid:
          type: string
          format: uuid
        publicKeyPem:
          type: string

    SyncRemoteRequest:
      type: object
      required: [name, baseUrl, pollIntervalSec, enabled]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        baseUrl:
          type: string
          format: uri
          description: The remote's http(s) URL without `/api`, e.g. `https://units.example.com`.
        pollIntervalSec:
          type: integer
          minimum: 10
          maximum: 86400
          description: >-
            Seconds between full syncs. Changes the remote pushes on its event
            stream arrive in between.
        enabled:
          type: boolean

    SyncRemote:
      allOf:
        - $ref: "#/components/schemas/SyncRemoteRequest"
        - type: object
          required: [id, lastSyncAt, lastSyncStatus, lastSyncError, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            lastSyncAt:
              description: End of the last full sync; null before the first.
              oneOf:
                - type: string
                  format: date-time
                - type: "null"
            lastSyncStatus:
              type: string
              enum: ["", ok, error]
            lastSyncError:
              type: string
              description: Why the last full sync failed; empty unless `lastSyncStatus` is `error`.
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    SyncLogEntry:
      type: object
      required: [time, level, message]
      properties:
        time:
          type: string
          format: date-time
        level:
          type: string
          enum: [info, error]
        message:
          type: string

    UnitEvent:
      type: object
      description: One change on the unit event stream.
      required: [type, id]
      properties:
        type:
          type: string
          enum: [created, updated, deleted]
        id:
          type: string
          format: uuid
        unit:
          description: The unit after the change; absent for `deleted`.
          $ref: "#/components/schemas/Unit"

    Version:
      type: object
      required: [commit]
      properties:
        commit:
          type: string
          description: Git commit the binary was built from.
        version:
          type: string
          description: Release tag; present only for tagged builds.

    Settings:
      type: object
      required: [mapStyleUrl]
      properties:
        mapStyleUrl:
          type: string
          maxLength: 2048
          description: >-
            Absolute http(s) URL of the MapLibre style JSON the map loads; empty
            uses the built-in OpenStreetMap style. The Content-Security-Policy
            allows the URL's origin, so the style's tiles, sprites and fonts
            must be served from there too.
          example: https://sgx.geodatenzentrum.de/gdz_basemapde_vektor/styles/bm_web_col.json

    Instance:
      type: object
      properties:
        name:
          type: string
          description: Instance name (INSTANCE_NAME); present only when configured.
