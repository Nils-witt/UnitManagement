# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: go-unit-mangement

before:
  hooks:
    - go mod tidy
    # The binary embeds frontend/dist, so build the UI first.
    - npm ci --prefix frontend
    - npm run build --prefix frontend

builds:
  - id: server
    main: .
    binary: go-unit-mangement
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X go-unit-mangement/internal/version.Version={{ .Tag }}
      - -X go-unit-mangement/internal/version.Commit={{ .ShortCommit }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - .env.example

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
